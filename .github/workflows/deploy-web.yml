name: deploy-web

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      godot_version:
        description: Godot version to export with
        required: false
        default: "4.7"

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  GODOT_VERSION: ${{ inputs.godot_version || '4.7' }}

jobs:
  export-web:
    name: Export Web and push to web branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-extract
          mv /tmp/godot-extract/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Cache export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-export-templates-${{ env.GODOT_VERSION }}

      - name: Download export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates-extract
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -r /tmp/templates-extract/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      # GitHub blocks files >= 100MB, but the exported index.pck is ~278MB.
      # The game sources must stay untouched, so all size reduction happens on
      # a throwaway copy in $RUNNER_TEMP:
      #   - textures: lossless PNG -> WebP lossy (quality 0.7, as set in the repo)
      #   - audio: stereo 44.1kHz -> mono 22.05kHz (OGG, ambient/music)
      # This shrinks index.pck to ~90MB. The cache below stores the fully
      # imported game-build snapshot so unchanged sources skip the re-import.

      - name: Prepare build copy (game/ is never modified)
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/game-build"
          mkdir -p "$RUNNER_TEMP/game-build"
          rsync -a --exclude 'web' game/ "$RUNNER_TEMP/game-build/"

      - name: Patch import settings in build copy
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/game-build"
          # Textures: lossless -> lossy WebP
          find . -name '*.png.import' -print0 | xargs -0 -I{} sed -i \
            -e 's/^compress\/mode=0$/compress\/mode=1/' \
            -e 's/^compress\/lossy_quality=.*$/compress\/lossy_quality=0.7/' {}
          # Audio: 44.1kHz stereo -> 22.05kHz mono (stays OGG)
          find . -name '*.wav.import' -print0 | xargs -0 -I{} sed -i \
            -e 's/^force\/mono=false$/force\/mono=true/' \
            -e 's/^force\/max_rate=false$/force\/max_rate=true/' \
            -e 's/^force\/max_rate_hz=44100$/force\/max_rate_hz=22050/' {}
          # Enable WebP in the import pipeline
          if ! grep -q '^textures/vram_compression/import_webp=true$' project.godot; then
            sed -i '/^textures\/vram_compression\/import_etc2_astc=true$/a textures/vram_compression/import_webp=true' project.godot
          fi

      - name: Restore web-build cache
        id: web-build-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/game-build
          key: web-build-v2-${{ env.GODOT_VERSION }}-${{ hashFiles('game/**') }}

      - name: Patch Web device-id fallback (game/ untouched)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/game-build"
          python3 - <<'PY'
          from pathlib import Path

          target = Path("world/presentation/ui/TownProviderCredentialStore.gd")
          marker = "# --- Web device-id fallback (injected by deploy-web.yml; repo game/ untouched) ---"
          old_line = "\tvar device_id := OS.get_unique_id().strip_edges()"

          # 除注入点外，项目里任何 Web 不安全 OS 调用都会在 Web 上重新报错。
          # tests/ 不会随部署运行，排除；隐藏目录（.godot 等）跳过。
          web_unsafe = ["OS.get_unique_id()", "OS.kill(", "execute_with_pipe"]
          strays = [
              str(p)
              for p in Path(".").rglob("*.gd")
              if p != target
              and "tests" not in p.parts
              and not any(part.startswith(".") for part in p.parts)
              and any(u in p.read_text(encoding="utf-8", errors="ignore") for u in web_unsafe)
          ]
          assert not strays, "web-unsafe OS calls found: " + ", ".join(strays)

          # Web 上 OS.get_unique_id() 被引擎硬桩并打印 ERROR，不能调用。
          # 改为：随机生成设备 ID 持久化到 user://device_id（Web 即 IndexedDB），
          # 非 Web 平台仍走 OS.get_unique_id()，桌面行为不变。
          helpers = '''
          # --- Web device-id fallback (injected by deploy-web.yml; repo game/ untouched) ---
          const WEB_DEVICE_ID_PATH := "user://device_id"
          const DEVICE_ID_BYTE_COUNT := 32

          func _device_id() -> String:
          \tif OS.has_feature("web"):
          \t\treturn _web_device_id()
          \treturn OS.get_unique_id().strip_edges()

          func _web_device_id() -> String:
          \tvar stored := _load_stored_device_id()
          \tif not stored.is_empty():
          \t\treturn stored
          \tvar generated := _generate_device_id()
          \tif _persist_device_id(generated):
          \t\treturn generated
          \treturn generated

          func _generate_device_id() -> String:
          \treturn Crypto.new().generate_random_bytes(DEVICE_ID_BYTE_COUNT).hex_encode()

          func _load_stored_device_id(path := WEB_DEVICE_ID_PATH) -> String:
          \tif not FileAccess.file_exists(path):
          \t\treturn ""
          \tvar file := FileAccess.open(path, FileAccess.READ)
          \tif file == null:
          \t\treturn ""
          \tvar stored := (file.get_as_text() as String).strip_edges()
          \tif stored.length() != DEVICE_ID_BYTE_COUNT * 2 or not stored.is_valid_hex_number(false):
          \t\treturn ""
          \treturn stored

          func _persist_device_id(device_id: String, path := WEB_DEVICE_ID_PATH) -> bool:
          \tvar file := FileAccess.open(path, FileAccess.WRITE)
          \tif file == null:
          \t\treturn false
          \tfile.store_string(device_id)
          \tfile.flush()
          \tvar error := file.get_error()
          \tfile = null
          \treturn error == OK
          '''

          # ---- 1) Credential store: Web-safe device id (real fix) ----
          text = target.read_text(encoding="utf-8")
          if marker not in text:
              # 缓存恢复的构建副本可能已包含注入代码；幂等跳过。
              assert text.count(old_line) == 1, (
                  "expected exactly one OS.get_unique_id() call site; source may have changed"
              )
              text = text.replace(old_line, "\tvar device_id := _device_id()")
              if not text.endswith("\n"):
                  text += "\n"
              text += helpers
              target.write_text(text, encoding="utf-8")
              print("patched TownProviderCredentialStore.gd with Web device-id fallback")
          else:
              print("credential store already patched, skipping")

          # ---- 2) TEMP diagnostics: print catalog/host failures to console ----
          gf_path = Path("world/presentation/game_flow/GameFlowHost.gd")
          gf = gf_path.read_text(encoding="utf-8")
          if "DIAG catalog snapshot fail" not in gf:
              a1 = "\n".join([
                  "func _startup_catalog_snapshot() -> Dictionary:",
                  "\tvar interrupted_recovery := _recover_interrupted_formal_overwrites()",
                  "\tif not bool(interrupted_recovery.get(\"ok\", false)):",
                  "\t\treturn interrupted_recovery",
              ])
              b1 = "\n".join([
                  "func _startup_catalog_snapshot() -> Dictionary:",
                  "\tvar interrupted_recovery := _recover_interrupted_formal_overwrites()",
                  "\tif not bool(interrupted_recovery.get(\"ok\", false)):",
                  '\t\tprinterr("DIAG catalog recovery fail: ", JSON.stringify(interrupted_recovery))',
                  "\t\treturn interrupted_recovery",
              ])
              assert gf.count(a1) == 1, "startup_catalog_snapshot anchor changed"
              gf = gf.replace(a1, b1)
              a2 = "\n".join([
                  "return _startup_save_catalog.call(",
                  "\t\t\"get_catalog\",",
                  "\t\tFORMAL_SLOT_DEFINITIONS.duplicate(true),",
                  "\t) as Dictionary",
              ])
              b2 = "\n".join([
                  "var snapshot_result := _startup_save_catalog.call(",
                  "\t\t\"get_catalog\",",
                  "\t\tFORMAL_SLOT_DEFINITIONS.duplicate(true),",
                  "\t) as Dictionary",
                  "\tif not bool(snapshot_result.get(\"ok\", false)):",
                  '\t\tprinterr("DIAG catalog snapshot fail: ", JSON.stringify(snapshot_result))',
                  "\treturn snapshot_result",
              ])
              assert gf.count(a2) == 1, "catalog return anchor changed"
              gf = gf.replace(a2, b2)
              gf_path.write_text(gf, encoding="utf-8")
              print("patched GameFlowHost.gd with catalog diagnostics (TEMP)")
          else:
              print("GameFlowHost diagnostics already present, skipping")

          st_path = Path("ui/startup/StartupScreen.gd")
          st = st_path.read_text(encoding="utf-8")
          if "DIAG host failure result" not in st:
              a3 = "func _host_failure_copy(result: Dictionary) -> String:"
              b3 = a3 + '\n\tprinterr("DIAG host failure result: ", JSON.stringify(result))'
              assert st.count(a3) == 1, "host_failure_copy anchor changed"
              st = st.replace(a3, b3)
              st_path.write_text(st, encoding="utf-8")
              print("patched StartupScreen.gd with host-failure diagnostics (TEMP)")
          else:
              print("StartupScreen diagnostics already present, skipping")
          PY

      - name: Import project (web build)
        if: steps.web-build-cache.outputs.cache-hit != 'true'
        run: godot --headless --path "$RUNNER_TEMP/game-build" --import

      - name: Save web-build cache
        if: steps.web-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/game-build
          key: web-build-v2-${{ env.GODOT_VERSION }}-${{ hashFiles('game/**') }}

      - name: Export Web
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release/ai-town-web"
          godot --headless --path "$RUNNER_TEMP/game-build" --export-release "Web" \
            "$GITHUB_WORKSPACE/release/ai-town-web/index.html"

      - name: Check file sizes (GitHub 100MB limit)
        run: |
          set -euo pipefail
          for f in "$GITHUB_WORKSPACE/release/ai-town-web"/*; do
            size=$(stat -c %s "$f")
            if [ "$size" -ge 104857600 ]; then
              echo "ERROR: $(basename "$f") is $size bytes (>= 100MB), cannot push to GitHub." >&2
              exit 1
            fi
          done
          echo "All files under 100MB."

      - name: Deploy to web branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOY_DIR="$RUNNER_TEMP/web-deploy"
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"
          git -C "$DEPLOY_DIR" init -q
          git -C "$DEPLOY_DIR" remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C "$DEPLOY_DIR" ls-remote --exit-code --heads origin web >/dev/null 2>&1; then
            git -C "$DEPLOY_DIR" fetch -q origin web
            git -C "$DEPLOY_DIR" checkout -q -B web FETCH_HEAD
            git -C "$DEPLOY_DIR" rm -qrf --ignore-unmatch . >/dev/null 2>&1 || true
          else
            git -C "$DEPLOY_DIR" checkout -q -b web
          fi
          rm -rf "$DEPLOY_DIR"/*
          cp -r "$GITHUB_WORKSPACE/release/ai-town-web/." "$DEPLOY_DIR"/
          git -C "$DEPLOY_DIR" config user.name "github-actions[bot]"
          git -C "$DEPLOY_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$DEPLOY_DIR" add -A
          if ! git -C "$DEPLOY_DIR" diff --cached --quiet; then
            git -C "$DEPLOY_DIR" commit -qm "Deploy web build from ${GITHUB_SHA}"
          fi
          git -C "$DEPLOY_DIR" push -q --force origin web
